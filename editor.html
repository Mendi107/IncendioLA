<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de zonas · La Adrada</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --carbon:#16181A; --carbon-alto:#1E2124; --granito:#2C3136;
  --hueso:#EDE8E0; --ceniza:#9AA0A6; --senal:#E8A33D; --pino:#5C8060;
  --radio:3px; --barra:56px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--carbon);color:var(--hueso);overflow:hidden;
  font:400 14px/1.5 "IBM Plex Sans",system-ui,sans-serif;
}
h1,h2{margin:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--senal);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

#mapa{position:fixed;top:var(--barra);left:320px;right:400px;bottom:0;background:#0F1112}
.leaflet-container{background:#0F1112}
.leaflet-control-attribution{background:rgba(22,24,26,.82)!important;color:var(--ceniza)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--ceniza)!important}
.leaflet-control-zoom{border:0!important}
.leaflet-control-zoom a{background:var(--carbon-alto)!important;color:var(--hueso)!important;border-color:var(--granito)!important}

.barra{
  position:fixed;top:0;left:0;right:0;height:var(--barra);z-index:600;
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--carbon-alto);border-bottom:1px solid var(--granito);
}
.barra h1{font-size:15px}
.barra__nota{font-size:12px;color:var(--ceniza)}
.barra__acc{margin-left:auto;display:flex;gap:8px;align-items:center}
.pendiente{font-size:12px;color:var(--senal)}

.btn{
  display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 13px;
  border-radius:var(--radio);background:var(--carbon-alto);
  border:1px solid var(--granito);font-size:13px;font-weight:500;cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:var(--granito)}
.btn--principal{background:var(--senal);border-color:var(--senal);color:#1A1204;font-weight:600}
.btn--principal:hover{background:#F0B155}
.btn--peligro:hover{background:#4A2320;border-color:#7A3A33}
.btn--min{height:27px;padding:0 9px;font-size:12px}

/* Columna izquierda: zonas */
.col{
  position:fixed;top:var(--barra);bottom:0;width:320px;left:0;z-index:500;
  display:flex;flex-direction:column;background:var(--carbon);
  border-right:1px solid var(--granito);
}
.col__cab{padding:13px 16px;border-bottom:1px solid var(--granito)}
.col__cab h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.col__cab p{margin:5px 0 0;font-size:12px;color:var(--ceniza)}
.col__cuerpo{flex:1;overflow-y:auto}
.col__pie{padding:12px 16px;border-top:1px solid var(--granito);display:flex;flex-direction:column;gap:8px}

.fila{
  display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:center;
  width:100%;text-align:left;padding:9px 16px;background:none;border:0;
  border-left:2px solid transparent;cursor:pointer;
}
.fila:hover{background:rgba(255,255,255,.04)}
.fila[aria-current="true"]{background:rgba(232,163,61,.14);border-left-color:var(--senal)}
.fila__n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--senal)}
.fila__t{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila__t small{display:block;font-weight:400;font-size:11px;color:var(--ceniza);font-family:"IBM Plex Mono",monospace}
.chip{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 6px;border-radius:2px;
  background:rgba(92,128,96,.22);color:#9FC4A3;
}
.chip--vacio{background:var(--granito);color:var(--ceniza)}

/* Columna derecha: formulario */
.form{
  position:fixed;top:var(--barra);bottom:0;right:0;width:400px;z-index:500;
  display:flex;flex-direction:column;background:var(--carbon);
  border-left:1px solid var(--granito);
}
.form__cab{padding:13px 16px;border-bottom:1px solid var(--granito);display:flex;align-items:center;gap:10px}
.form__cab h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em}
.form__cuerpo{flex:1;overflow-y:auto;padding:16px}
.form__pie{padding:12px 16px;border-top:1px solid var(--granito);display:flex;gap:8px}

label{display:block;margin-bottom:13px}
label span{
  display:block;margin-bottom:5px;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ceniza);
}
input[type=text],input[type=date],textarea,select{
  width:100%;padding:8px 10px;background:#101214;
  border:1px solid var(--granito);border-radius:var(--radio);color:var(--hueso);
}
input:focus,textarea:focus,select:focus{border-color:var(--senal);outline:0}
textarea{resize:vertical;min-height:64px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.clips{margin-top:6px}
.clips__cab{
  display:flex;align-items:center;gap:8px;margin-bottom:9px;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ceniza);
}
.clip{
  border:1px solid var(--granito);border-radius:var(--radio);
  padding:10px;margin-bottom:9px;background:var(--carbon-alto);
}
.clip__top{display:grid;grid-template-columns:92px 1fr auto;gap:7px;margin-bottom:7px}
.clip__top select{padding:6px 7px;font-size:12.5px}
.clip__top input{padding:6px 8px;font-size:12.5px}
.clip__quitar{
  border:1px solid var(--granito);background:none;border-radius:var(--radio);
  width:28px;cursor:pointer;color:var(--ceniza);
}
.clip__quitar:hover{background:#4A2320;color:var(--hueso)}
.clip input.titulo{padding:6px 8px;font-size:12.5px}

.suelta{
  border:1px dashed var(--granito);border-radius:var(--radio);
  padding:13px;text-align:center;font-size:12px;color:var(--ceniza);
}
.suelta.encima{border-color:var(--senal);color:var(--senal);background:rgba(232,163,61,.08)}
.vacio{padding:30px 16px;text-align:center;font-size:13px;color:var(--ceniza);line-height:1.6}

.marcador-caja{background:none!important;border:0!important}
.marcador{
  width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--senal);color:#1A1204;border:2px solid rgba(0,0,0,.4);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;
  box-shadow:0 0 0 4px rgba(232,163,61,.15);cursor:grab;
}
.marcador--vacio{background:var(--granito);color:var(--ceniza);box-shadow:none}
.marcador--sel{box-shadow:0 0 0 9px rgba(232,163,61,.25);transform:scale(1.12)}

@media (max-width:1200px){
  #mapa{left:0;right:0;top:calc(var(--barra) + 0px);bottom:45%}
  .col{top:auto;bottom:0;height:45%;width:50%;border-top:1px solid var(--granito)}
  .form{top:auto;bottom:0;height:45%;width:50%;left:50%;right:auto}
}
</style>
</head>
<body>

<header class="barra">
  <h1>Editor de zonas</h1>
  <span class="barra__nota">Haz clic en el mapa para crear un punto · arrastra un marcador para moverlo</span>
  <div class="barra__acc">
    <span class="pendiente" id="pendiente"></span>
    <button class="btn" id="btn-capa">Satélite</button>
    <button class="btn btn--principal" id="btn-guardar">Descargar zonas.js</button>
  </div>
</header>

<div id="mapa"></div>

<aside class="col">
  <div class="col__cab">
    <h2>Zonas</h2>
    <p id="col-resumen">—</p>
  </div>
  <div class="col__cuerpo" id="col-cuerpo"></div>
  <div class="col__pie">
    <button class="btn" id="btn-copiar">Copiar al portapapeles</button>
    <span style="font-size:11.5px;color:var(--ceniza)">Al descargar, sustituye el <span class="mono">zonas.js</span> de la carpeta del proyecto.</span>
  </div>
</aside>

<section class="form">
  <div class="form__cab">
    <h2 id="form-titulo">Ninguna zona seleccionada</h2>
  </div>
  <div class="form__cuerpo" id="form-cuerpo">
    <div class="vacio">Haz clic en el mapa, en el sitio donde se grabó un vídeo, para dar de alta la primera zona.</div>
  </div>
  <div class="form__pie" id="form-pie" hidden>
    <button class="btn btn--peligro" id="btn-borrar">Borrar zona</button>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="zonas.js"></script>
<script>
(function(){
  "use strict";

  var CENTRO = [40.2989, -4.6389];
  var datos = JSON.parse(JSON.stringify(typeof ZONAS !== "undefined" ? ZONAS : []));
  var sel = null, sucio = false, marcas = {};

  var mapa = L.map("mapa", { center: CENTRO, zoom: 14, zoomControl: false });
  L.control.zoom({ position: "bottomright" }).addTo(mapa);
  var cMapa = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(mapa);
  var cSat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, attribution: "Esri, Maxar, Earthstar Geographics"
  });
  document.getElementById("btn-capa").addEventListener("click", function(){
    if (mapa.hasLayer(cSat)) { mapa.removeLayer(cSat); cMapa.addTo(mapa); this.textContent = "Satélite"; }
    else { mapa.removeLayer(cMapa); cSat.addTo(mapa); this.textContent = "Mapa"; }
  });

  if (datos.length) mapa.fitBounds(L.latLngBounds(datos.map(function(z){ return z.coords; })).pad(0.3));

  /* ---------- utilidades ---------- */
  function esc(s){
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function zona(id){ return datos.filter(function(z){ return z.id === id; })[0]; }
  function nClips(z){ return (z.videos || []).length; }
  function toca(){ sucio = true; document.getElementById("pendiente").textContent = "cambios sin descargar"; }
  function hoy(){ return new Date().toISOString().slice(0,10); }
  function slug(s){
    return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  }

  /* ---------- marcadores ---------- */
  function pinta(){
    Object.keys(marcas).forEach(function(k){ mapa.removeLayer(marcas[k]); });
    marcas = {};
    datos.forEach(function(z, i){
      var m = L.marker(z.coords, {
        draggable: true,
        icon: L.divIcon({
          className: "marcador-caja",
          html: '<div class="marcador' + (nClips(z) ? "" : " marcador--vacio") +
                (z.id === sel ? " marcador--sel" : "") + '">' + (i + 1) + "</div>",
          iconSize: [28,28], iconAnchor: [14,14]
        })
      }).addTo(mapa);
      m.bindTooltip(z.nombre || "(sin nombre)", { direction: "top", offset: [0,-15] });
      m.on("click", function(){ selecciona(z.id); });
      m.on("dragend", function(e){
        var ll = e.target.getLatLng();
        z.coords = [Number(ll.lat.toFixed(5)), Number(ll.lng.toFixed(5))];
        toca(); if (z.id === sel) formulario(); lista();
      });
      marcas[z.id] = m;
    });
  }

  mapa.on("click", function(e){
    var id = datos.reduce(function(m, z){ return Math.max(m, Number(z.id) || 0); }, 0) + 1;
    datos.push({
      id: id, nombre: "", paraje: "", fecha: hoy(), autor: "", descripcion: "",
      coords: [Number(e.latlng.lat.toFixed(5)), Number(e.latlng.lng.toFixed(5))],
      videos: []
    });
    toca(); selecciona(id);
    var inp = document.querySelector("#form-cuerpo input[data-campo=nombre]");
    if (inp) inp.focus();
  });

  /* ---------- lista ---------- */
  function lista(){
    var cont = document.getElementById("col-cuerpo");
    cont.innerHTML = "";
    if (!datos.length) {
      cont.innerHTML = '<div class="vacio">Todavía no hay zonas.</div>';
    }
    datos.forEach(function(z, i){
      var b = document.createElement("button");
      b.className = "fila";
      if (z.id === sel) b.setAttribute("aria-current", "true");
      b.innerHTML =
        '<span class="fila__n">' + String(i+1).padStart(2,"0") + "</span>" +
        '<span class="fila__t">' + (esc(z.nombre) || "(sin nombre)") +
        "<small>" + z.coords[0].toFixed(4) + ", " + z.coords[1].toFixed(4) + "</small></span>" +
        '<span class="chip' + (nClips(z) ? "" : " chip--vacio") + '">' +
        (nClips(z) ? nClips(z) + " vid" : "vacía") + "</span>";
      b.addEventListener("click", function(){ selecciona(z.id); mapa.panTo(z.coords); });
      cont.appendChild(b);
    });
    var conV = datos.filter(function(z){ return nClips(z); }).length;
    document.getElementById("col-resumen").textContent =
      datos.length + (datos.length === 1 ? " zona" : " zonas") + " · " + conV + " con vídeo";
  }

  function selecciona(id){ sel = id; pinta(); lista(); formulario(); }

  /* ---------- formulario ---------- */
  function formulario(){
    var z = zona(sel);
    var cuerpo = document.getElementById("form-cuerpo");
    document.getElementById("form-pie").hidden = !z;
    if (!z) {
      document.getElementById("form-titulo").textContent = "Ninguna zona seleccionada";
      cuerpo.innerHTML = '<div class="vacio">Haz clic en el mapa para crear un punto.</div>';
      return;
    }
    document.getElementById("form-titulo").textContent = "Zona " + z.id;

    cuerpo.innerHTML =
      '<label><span>Nombre de la zona</span><input type="text" data-campo="nombre" value="' + esc(z.nombre) + '" placeholder="Pinar de la Chorrera"></label>' +
      '<label><span>Paraje / referencia</span><input type="text" data-campo="paraje" value="' + esc(z.paraje) + '" placeholder="Pista forestal, 1,5 km al norte"></label>' +
      '<div class="dos">' +
        '<label><span>Fecha</span><input type="date" data-campo="fecha" value="' + esc(z.fecha) + '"></label>' +
        '<label><span>Autor</span><input type="text" data-campo="autor" value="' + esc(z.autor) + '" placeholder="Quién grabó"></label>' +
      "</div>" +
      '<label><span>Descripción</span><textarea data-campo="descripcion" placeholder="Qué se ve en el vídeo">' + esc(z.descripcion) + "</textarea></label>" +
      '<div class="clips"><div class="clips__cab">Vídeos<button class="btn btn--min" id="btn-clip">+ Añadir</button></div>' +
      '<div id="clips"></div>' +
      '<div class="suelta" id="suelta">Arrastra aquí los archivos de vídeo para coger sus nombres</div></div>' +
      '<p class="mono" style="margin:14px 0 0;font-size:11.5px;color:var(--ceniza)">' +
        z.coords[0].toFixed(5) + ", " + z.coords[1].toFixed(5) + "</p>";

    Array.prototype.forEach.call(cuerpo.querySelectorAll("[data-campo]"), function(el){
      el.addEventListener("input", function(){
        z[el.dataset.campo] = el.value;
        toca(); lista();
        if (marcas[z.id]) marcas[z.id].setTooltipContent(z.nombre || "(sin nombre)");
      });
    });

    document.getElementById("btn-clip").addEventListener("click", function(){
      z.videos = z.videos || [];
      z.videos.push({ src: "videos/" + (slug(z.nombre) || "video") + ".mp4", titulo: "" });
      toca(); clips(); lista(); pinta();
    });

    var suelta = document.getElementById("suelta");
    ["dragenter","dragover"].forEach(function(ev){
      suelta.addEventListener(ev, function(e){ e.preventDefault(); suelta.classList.add("encima"); });
    });
    ["dragleave","drop"].forEach(function(ev){
      suelta.addEventListener(ev, function(){ suelta.classList.remove("encima"); });
    });
    suelta.addEventListener("drop", function(e){
      e.preventDefault();
      z.videos = z.videos || [];
      Array.prototype.forEach.call(e.dataTransfer.files, function(f){
        z.videos.push({ src: "videos/" + f.name, titulo: "" });
      });
      toca(); clips(); lista(); pinta();
    });

    clips();
  }

  function clips(){
    var z = zona(sel), cont = document.getElementById("clips");
    if (!cont) return;
    cont.innerHTML = "";
    (z.videos || []).forEach(function(v, i){
      var esYT = !!v.youtube;
      var d = document.createElement("div");
      d.className = "clip";
      d.innerHTML =
        '<div class="clip__top">' +
          "<select>" +
            '<option value="src"' + (esYT ? "" : " selected") + ">Archivo</option>" +
            '<option value="youtube"' + (esYT ? " selected" : "") + ">YouTube</option>" +
          "</select>" +
          '<input type="text" class="valor" value="' + esc(esYT ? v.youtube : (v.src || "")) +
            '" placeholder="' + (esYT ? "ID del vídeo" : "videos/nombre.mp4") + '">' +
          '<button class="clip__quitar" title="Quitar">✕</button>' +
        "</div>" +
        '<input type="text" class="titulo" value="' + esc(v.titulo || "") + '" placeholder="Título del clip (opcional)">';

      d.querySelector("select").addEventListener("change", function(){
        var val = d.querySelector(".valor").value;
        if (this.value === "youtube") { delete v.src; v.youtube = val; }
        else { delete v.youtube; v.src = val; }
        toca(); clips();
      });
      d.querySelector(".valor").addEventListener("input", function(){
        if (v.youtube !== undefined) v.youtube = this.value; else v.src = this.value;
        toca();
      });
      d.querySelector(".titulo").addEventListener("input", function(){
        v.titulo = this.value; toca();
      });
      d.querySelector(".clip__quitar").addEventListener("click", function(){
        z.videos.splice(i, 1); toca(); clips(); lista(); pinta();
      });
      cont.appendChild(d);
    });
  }

  document.getElementById("btn-borrar").addEventListener("click", function(){
    var z = zona(sel);
    if (!z || !confirm("¿Borrar la zona \u201c" + (z.nombre || "sin nombre") + "\u201d?")) return;
    datos = datos.filter(function(x){ return x.id !== sel; });
    sel = null; toca(); pinta(); lista(); formulario();
  });

  /* ---------- exportar ---------- */
  var CABECERA =
    "/* Generado con editor.html — La Adrada, vídeos del incendio.\n" +
    "   Puedes seguir editando a mano; el formato es JavaScript normal. */\n\n";

  function texto(){
    var cuerpo = datos.map(function(z){
      var l = [];
      l.push("    id: " + z.id);
      l.push("    nombre: " + JSON.stringify(z.nombre || ""));
      if (z.paraje) l.push("    paraje: " + JSON.stringify(z.paraje));
      if (z.fecha) l.push("    fecha: " + JSON.stringify(z.fecha));
      if (z.autor) l.push("    autor: " + JSON.stringify(z.autor));
      if (z.descripcion) l.push("    descripcion: " + JSON.stringify(z.descripcion));
      l.push("    coords: [" + z.coords[0] + ", " + z.coords[1] + "]");
      var vids = (z.videos || []).map(function(v){
        var p = [];
        if (v.youtube) p.push("youtube: " + JSON.stringify(v.youtube));
        else p.push("src: " + JSON.stringify(v.src || ""));
        if (v.titulo) p.push("titulo: " + JSON.stringify(v.titulo));
        if (v.autor) p.push("autor: " + JSON.stringify(v.autor));
        return "      { " + p.join(", ") + " }";
      });
      l.push("    videos: " + (vids.length ? "[\n" + vids.join(",\n") + "\n    ]" : "[]"));
      if (Array.isArray(z.area) && z.area.length > 2) {
        l.push("    area: [\n" + z.area.map(function(p){
          return "      [" + p[0] + ", " + p[1] + "]";
        }).join(",\n") + "\n    ]");
      }
      return "  {\n" + l.join(",\n") + "\n  }";
    }).join(",\n\n");
    return CABECERA + "const ZONAS = [\n\n" + cuerpo + "\n\n];\n";
  }

  document.getElementById("btn-guardar").addEventListener("click", function(){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([texto()], { type: "text/javascript" }));
    a.download = "zonas.js";
    a.click();
    URL.revokeObjectURL(a.href);
    sucio = false;
    document.getElementById("pendiente").textContent = "descargado";
  });

  document.getElementById("btn-copiar").addEventListener("click", function(){
    var btn = this;
    navigator.clipboard.writeText(texto()).then(function(){
      btn.textContent = "Copiado"; sucio = false;
      document.getElementById("pendiente").textContent = "";
      setTimeout(function(){ btn.textContent = "Copiar al portapapeles"; }, 1600);
    }, function(){ btn.textContent = "No se pudo copiar"; });
  });

  window.addEventListener("beforeunload", function(e){
    if (sucio) { e.preventDefault(); e.returnValue = ""; }
  });

  pinta(); lista(); formulario();
})();
</script>
</body>
</html>
